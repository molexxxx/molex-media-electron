# Release: builds, signs, and publishes installers with a generated changelog
# when a version tag (v*.*.*) is pushed. Packaging waits for the unit tests
# and the golden FFmpeg suite, so a tag cannot ship a failing pipeline.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read  # allows notarize-complete to download artifacts across runs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: '1'

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Unit tests with coverage
        run: npm run test:coverage

  golden:
    name: Golden FFmpeg suite
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      golden-only: true

  release:
    name: Release (${{ matrix.os }})
    needs: [test, golden]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            script: package:win
          - os: macos-26
            script: package:mac
          - os: ubuntu-24.04
            script: package:linux

    runs-on: ${{ matrix.os }}

    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for changelog generation

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_DL_SKIP_DOWNLOAD: '1'

      # The runner image's packages.microsoft.com source is not needed here, and
      # when it fails, apt-get update fails the release with it.
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f -exec grep -q 'packages\.microsoft\.com' {} \; -delete
          sudo apt-get update
          sudo apt-get install -y rpm

      # macOS, signed: builds a signed (not-yet-notarized) .dmg/.zip. The next
      # step submits the .dmg to Apple without waiting; the notarize-macos job
      # polls for approval and staples it.
      - name: Build & Package (macOS, signed)
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Submit the signed .dmg to Apple notarization without waiting. notarytool
      # accepts .dmg/.zip/.pkg (not a raw .app). Notarizing the .dmg also
      # registers the inner app's signature with Apple, so the updater .zip is
      # covered for online Gatekeeper checks even though only the .dmg is stapled.
      - name: Submit macOS .dmg for notarization (no-wait)
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(ls dist/molexMedia-*-macOS-Installer.dmg | head -1)
          echo "Submitting $dmg for notarization (no-wait)..."
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --no-wait --output-format json | tee notarization-submission.json
          echo "Submission id: $(jq -r '.id' notarization-submission.json)"

      # macOS fallback: unsigned build when signing secrets are absent.
      - name: Build & Package (macOS, unsigned)
        if: runner.os == 'macOS' && env.MAC_CSC_LINK == ''
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build & Package (Windows/Linux)
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Windows / Linux: upload directly to the draft release.
      - name: Upload installers to draft release (Windows/Linux)
        if: runner.os != 'macOS'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            dist/molexMedia-*-Windows-Setup.exe
            dist/molexMedia-*-Linux-Installer.deb
            dist/molexMedia-*-Linux-Installer.rpm
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS signed: stash artifacts for the notarize-macos job instead of
      # uploading to the draft release. The signed-but-unstapled .dmg is also
      # uploaded to the draft so that notarize-complete.yml can find it by tag
      # if the notarize-macos job times out (>6 h initial notarization).
      - name: Save macOS artifacts for notarization job
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        uses: actions/upload-artifact@v7
        with:
          name: macos-notarize
          path: |
            dist/molexMedia-*-macOS-Installer.dmg
            dist/molexMedia-*-macOS-Updater.zip
            dist/latest-mac.yml
            notarization-submission.json
          retention-days: 90

      - name: Upload unstapled macOS installer to draft release
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            dist/molexMedia-*-macOS-Installer.dmg
            dist/molexMedia-*-macOS-Updater.zip
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS unsigned fallback: upload directly (no notarization step needed).
      - name: Upload macOS unsigned build to draft release
        if: runner.os == 'macOS' && env.MAC_CSC_LINK == ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            dist/molexMedia-*-macOS-Installer.dmg
            dist/molexMedia-*-macOS-Updater.zip
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Waits for Apple to approve the notarization submission, then staples the
  # ticket to the .dmg and replaces the unstapled asset in the draft release.
  # Timeout: 6 hours. If Apple hasn't responded by then (common for the very
  # first submission on a new Developer account), let this job fail and use
  # the notarize-complete workflow (workflow_dispatch) to finish manually.
  notarize-macos:
    name: Notarize & Staple macOS
    needs: release
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Download macOS artifacts
        id: download
        uses: actions/download-artifact@v8
        with:
          name: macos-notarize
        continue-on-error: true

      - name: Skip if no notarization artifact (unsigned build)
        if: steps.download.outcome == 'failure'
        run: echo "No macos-notarize artifact - unsigned build or credentials not set, skipping."

      - name: Wait for Apple notarization
        if: steps.download.outcome == 'success'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          submission_id=$(jq -r '.id' notarization-submission.json)
          echo "Waiting on Apple notarization submission: $submission_id"

          # Retry up to 5 times to recover from transient network drops.
          for attempt in $(seq 1 5); do
            if xcrun notarytool wait "$submission_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID"; then
              echo "Notarization accepted (attempt $attempt)"
              exit 0
            fi

            # notarytool wait exited non-zero - could be network drop or rejection.
            status=$(xcrun notarytool info "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json 2>/dev/null \
              | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")

            echo "Status after wait exit (attempt $attempt/5): $status"

            case "$status" in
              Accepted)
                echo "Already accepted (status check)"
                exit 0
                ;;
              Invalid|Rejected)
                xcrun notarytool log "$submission_id" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
                ;;
              *)
                if [ "$attempt" -lt 5 ]; then
                  echo "Retrying in 60 s (likely a network blip)..."
                  sleep 60
                else
                  echo "All retry attempts exhausted - job timed out or network is broken."
                  echo "Use the 'Complete macOS Notarization' workflow to finish manually."
                  exit 1
                fi
                ;;
            esac
          done

      - name: Staple notarization ticket to installer
        if: steps.download.outcome == 'success'
        run: |
          dmg=$(ls dist/molexMedia-*-macOS-Installer.dmg | head -1)
          # Apple's ticket can lag behind notarytool "Accepted"; stapler then
          # fails with exit 66 (ticket not found). Retry until the CDN has it.
          for attempt in $(seq 1 10); do
            if xcrun stapler staple -v "$dmg"; then
              echo "Stapled on attempt $attempt"
              exit 0
            fi
            echo "Staple attempt $attempt/10 failed (ticket not propagated yet); retrying in 30 s..."
            sleep 30
          done
          echo "Stapling failed after all retries"
          exit 1

      # Replace the unstapled .dmg in the draft release with the stapled one.
      - name: Upload stapled macOS installer to draft release
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/molexMedia-*-macOS-Installer.dmg \
            --repo "${{ github.repository }}" \
            --clobber

  publish:
    name: Publish Release
    needs: [release, notarize-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # git-cliff's --latest resolves the release boundary from the tags it
      # can see, and inside the action's container that discovery has failed
      # silently, emitting the entire project history as one release (v4.6.0
      # shipped with 308 entries instead of 83). Resolve the boundary here
      # with plain git and hand git-cliff an explicit range instead.
      - name: Resolve changelog range
        id: range
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            echo "Changelog range: ${prev}..${TAG}"
            echo "args=--strip header ${prev}..${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "No previous tag found; falling back to --latest"
            echo "args=--strip header --latest" >> "$GITHUB_OUTPUT"
          fi

      # The hand-written CHANGELOG.md section is the release notes; commit
      # subjects here are plain sentences, so git-cliff's conventional-commit
      # groups would list only Dependabot's bumps. It runs only when the
      # changelog has no section for the tag.
      - name: Take the notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          PREV: ${{ steps.range.outputs.prev }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" "$PREV" "$GITHUB_REPOSITORY" > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section for ${TAG}; generating notes from the commits"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        if: steps.notes.outputs.found != 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: ${{ steps.range.outputs.args }}
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish release with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes-file RELEASE_NOTES.md \
            --draft=false --latest

  notify-badges:
    name: Refresh profile badges
    needs: [publish]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch refresh-badges
        env:
          GH_TOKEN: ${{ secrets.BADGES_DISPATCH_TOKEN }}
        run: |
          gh api -X POST repos/molexxxx/molexxxx/dispatches \
            -f event_type=refresh-badges \
            -f "client_payload[repo]=${{ github.repository }}"
