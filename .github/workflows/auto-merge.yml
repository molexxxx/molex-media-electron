# -----------------------------------------------------
# Auto-merge - Merge passing Dependabot PRs automatically
# -----------------------------------------------------
name: Auto-merge Dependabot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Retried because parallel Dependabot merges move main underneath this
      # call, which GitHub rejects with "Base branch was modified".
      - name: Enable auto-merge
        run: |
          for attempt in 1 2 3 4 5; do
            if gh pr merge --auto --squash "$PR_URL"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::Could not enable auto-merge after 5 attempts"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
